<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>RxNaija</title>
<!--
  The launch screen.

  WHY THIS EXISTS AT ALL
  A wrapped web app's tell is the first second: a blank white rectangle while
  the page loads, which no native application does. The main window stays
  hidden until the dashboard has actually finished loading, and this stands in
  front of that gap — so the app appears instantly and then hands over, rather
  than appearing empty and filling in.

  It is deliberately NOT a progress bar. There is nothing honest to measure
  (the dashboard's load time depends on a network we know nothing about), and
  a bar that jumps to 90% and waits is a lie told in animation.

  Everything here is inline and self-contained: this window loads from the
  local filesystem before any network exists, so a webfont or an external
  stylesheet would be exactly the thing that made it slow.
-->
<style>
  :root {
    --accent:      oklch(72% 0.132 165);
    --accent-deep: oklch(65% 0.132 165);
    --on-accent:   oklch(21% 0.030 165);
    --paper:       oklch(99.2% 0.004 165);
    --ink:         oklch(24% 0.014 165);
    --ink-soft:    oklch(52% 0.012 165);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    height: 100%;
    /* The window itself is frameless and transparent; this rounded card is
       the visible app. Matching the OS's own corner radius is most of what
       makes a borderless window read as native rather than as a floating
       web page. */
    background: transparent;
    overflow: hidden;
    -webkit-user-select: none;
    user-select: none;
    font-family: Inter, -apple-system, "Segoe UI", system-ui, sans-serif;
  }

  .card {
    position: relative;
    height: 100%;
    border-radius: 14px;
    background: var(--paper);
    border: 1px solid oklch(90% 0.008 165);
    box-shadow: 0 20px 50px -12px oklch(21% 0.02 165 / 0.28);
    display: grid;
    place-items: center;
    /* The whole splash is a drag handle. A frameless window with no way to
       move it feels broken, and there is no title bar here to grab. */
    -webkit-app-region: drag;
    overflow: hidden;
  }

  /* A single slow sweep across the card. Not a spinner: this says "something
     is happening" without implying a measurable amount of it. */
  .card::after {
    content: '';
    position: absolute;
    inset: 0;
    background: linear-gradient(115deg,
      transparent 30%,
      oklch(72% 0.132 165 / 0.07) 48%,
      transparent 66%);
    transform: translateX(-100%);
    animation: sweep 2.6s ease-in-out infinite;
  }
  @keyframes sweep { to { transform: translateX(100%); } }

  .inner { position: relative; z-index: 1; text-align: center; }

  .mark {
    width: 60px; height: 60px;
    margin: 0 auto;
    border-radius: 17px;
    background: linear-gradient(145deg, var(--accent), var(--accent-deep));
    box-shadow: 0 2px 4px oklch(21% 0.02 165 / 0.12),
                0 14px 30px -10px oklch(21% 0.02 165 / 0.45);
    display: grid; place-items: center;
    color: var(--on-accent);
    font-size: 1.75rem; font-weight: 800; letter-spacing: -0.02em;
    /* Settles once rather than looping. A mark that keeps pulsing reads as a
       page still working; one that arrives and stops reads as an app that has
       opened. */
    animation: settle 620ms cubic-bezier(0.2, 0.9, 0.25, 1) both;
  }
  @keyframes settle {
    from { opacity: 0; transform: scale(0.82) translateY(8px); }
    to   { opacity: 1; transform: none; }
  }

  .name {
    margin-top: 14px;
    font-size: 1.0625rem; font-weight: 700; letter-spacing: -0.02em;
    color: var(--ink);
    animation: rise 520ms ease-out 140ms both;
  }
  .tag {
    margin-top: 3px;
    font-size: 0.75rem; color: var(--ink-soft);
    animation: rise 520ms ease-out 240ms both;
  }
  @keyframes rise {
    from { opacity: 0; transform: translateY(6px); }
    to   { opacity: 1; transform: none; }
  }

  /* The same three dots the dashboard uses for every loading state, so the
     app and the web app speak with one voice from the first frame. */
  .dots {
    margin-top: 20px;
    display: inline-flex; gap: 5px;
    animation: rise 520ms ease-out 360ms both;
  }
  .dots i {
    width: 5px; height: 5px; border-radius: 999px;
    background: var(--ink-soft); opacity: 0.3;
    animation: bounce 1.2s ease-in-out infinite;
  }
  .dots i:nth-child(2) { animation-delay: 0.16s; }
  .dots i:nth-child(3) { animation-delay: 0.32s; }
  @keyframes bounce {
    0%, 80%, 100% { opacity: 0.3; transform: translateY(0); }
    40%           { opacity: 1;   transform: translateY(-3px); }
  }

  /* Only appears if loading takes long enough to be worth explaining. Set by
     main.js, not on a timer here, so it reflects the real load. */
  .slow {
    margin-top: 16px;
    font-size: 0.6875rem; color: var(--ink-soft);
    opacity: 0; transition: opacity 400ms ease;
    max-width: 230px; margin-left: auto; margin-right: auto; line-height: 1.45;
  }
  .slow.show { opacity: 1; }

  @media (prefers-reduced-motion: reduce) {
    .card::after { animation: none; }
    .mark, .name, .tag, .dots { animation: none; opacity: 1; transform: none; }
    /* Frozen visible rather than removed — the dots are the only indication
       anything is happening. */
    .dots i { animation: none; opacity: 0.6; }
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --paper:    oklch(21% 0.012 165);
      --ink:      oklch(96% 0.004 165);
      --ink-soft: oklch(72% 0.010 165);
    }
    .card { border-color: oklch(30% 0.012 165); }
  }
</style>
</head>
<body>
  <div class="card">
    <div class="inner">
      <div class="mark">R</div>
      <div class="name">RxNaija</div>
      <div class="tag">The counter your customers actually message.</div>
      <div class="dots" aria-hidden="true"><i></i><i></i><i></i></div>
      <p class="slow" id="slow">Still connecting. Check this computer&rsquo;s internet if this stays up.</p>
    </div>
  </div>
  <script>
    // Called from main.js when the load is genuinely taking a while, rather
    // than guessing at a duration in here.
    window.addEventListener('message', (e) => {
      if (e.data === 'slow') document.getElementById('slow').classList.add('show');
    });
  </script>
</body>
</html>
