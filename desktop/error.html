<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>RxNaija</title>
<!--
  Shown instead of Chrome's offline dinosaur.

  That page is the single loudest tell that an app is a wrapped web page, and
  worse, it is written for someone who understands browsers. A pharmacist
  reading "ERR_NAME_NOT_RESOLVED" learns nothing they can act on.

  Local and self-contained on purpose: it is displayed precisely when the
  network is not working, so it cannot fetch anything.
-->
<style>
  :root {
    --accent:      oklch(72% 0.132 165);
    --accent-deep: oklch(65% 0.132 165);
    --on-accent:   oklch(21% 0.030 165);
    --paper:       oklch(99.2% 0.004 165);
    --ink:         oklch(24% 0.014 165);
    --ink-soft:    oklch(52% 0.012 165);
    --line:        oklch(90% 0.008 165);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --paper: oklch(21% 0.012 165); --ink: oklch(96% 0.004 165);
      --ink-soft: oklch(72% 0.010 165); --line: oklch(30% 0.012 165);
    }
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    min-height: 100vh; display: grid; place-items: center;
    background: var(--paper); color: var(--ink);
    font-family: Inter, -apple-system, "Segoe UI", system-ui, sans-serif;
    padding: 24px; -webkit-user-select: none; user-select: none;
  }
  .box { max-width: 380px; text-align: center; }
  .mark {
    width: 46px; height: 46px; margin: 0 auto 18px;
    border-radius: 13px;
    background: linear-gradient(145deg, var(--accent), var(--accent-deep));
    display: grid; place-items: center;
    color: var(--on-accent); font-size: 1.3rem; font-weight: 800;
  }
  h1 { font-size: 1.125rem; font-weight: 700; letter-spacing: -0.02em; }
  p  { margin-top: 8px; font-size: 0.875rem; color: var(--ink-soft); line-height: 1.55; }
  ul { margin: 14px auto 0; max-width: 300px; text-align: left;
       font-size: 0.8125rem; color: var(--ink-soft); line-height: 1.7; padding-left: 18px; }
  button {
    margin-top: 20px; padding: 9px 18px; border: 0; border-radius: 9px;
    background: var(--ink); color: var(--paper);
    font-size: 0.875rem; font-weight: 600; font-family: inherit; cursor: pointer;
  }
  button:hover { opacity: 0.9; }
  .detail {
    margin-top: 18px; padding-top: 12px; border-top: 1px solid var(--line);
    font-size: 0.6875rem; color: var(--ink-soft); word-break: break-word;
  }
</style>
</head>
<body>
  <div class="box">
    <div class="mark">R</div>
    <h1>Can&rsquo;t reach RxNaija</h1>
    <p>This computer isn&rsquo;t able to connect. Your data is safe — nothing has been lost.</p>
    <ul>
      <li>Check this computer is connected to the internet</li>
      <li>Try opening a website in your browser</li>
      <li>If the internet works, RxNaija may be briefly down — try again in a few minutes</li>
    </ul>
    <button id="retry">Try again</button>
    <p class="detail" id="detail"></p>
  </div>
  <script>
    const q = new URLSearchParams(location.search);
    const target = q.get('target') || 'https://app.rxnaija.com';
    // The technical reason is kept, but small and at the bottom — useless to
    // a pharmacist, and the first thing support will ask for.
    const desc = q.get('desc');
    if (desc) document.getElementById('detail').textContent = desc + (q.get('code') ? ' (' + q.get('code') + ')' : '');
    document.getElementById('retry').addEventListener('click', () => {
      location.href = target;
    });
  </script>
</body>
</html>
