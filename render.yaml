# Render blueprint — ONE service.
#
# The API also serves the built dashboard (see the static block near the end
# of server/index.js), so there is no second static site to pay for or keep
# in step. `npm run build` installs the client's dependencies and produces
# client/dist; `npm start` serves both that and /api from the same process.
#
# WHY NOT THE FREE PLAN
# Free web services sleep after ~15 minutes idle. This process holds a live
# WhatsApp socket (Baileys) and runs the job worker in-process, so sleeping
# does not merely delay a request — it drops the pharmacy's connection and
# stops the sweeps that return held stock and chase unanswered consultations.
# A messaging product cannot be asleep between messages.
#
# REGION: the Supabase pooler is eu-west-3 (Paris). frankfurt is the closest
# Render region, which keeps every query on the same continent as the
# database instead of paying an Atlantic round trip per call.
services:
  - type: web
    name: rxnaija
    runtime: node
    plan: starter
    region: frankfurt
    branch: main
    buildCommand: npm install && npm run build
    startCommand: npm start
    # /api/live, NOT /api/health. The two are different questions and the
    # distinction is load-bearing — server/index.js says so at length above
    # the route, and this line contradicted it until 2026-09-06.
    #
    # /api/health is READINESS: it pings Postgres and answers 503 when the
    # database is down. That is exactly right for a human or a monitor asking
    # "is anything wrong".
    #
    # A platform health check is not that question. Render RESTARTS a service
    # whose health check fails. Pointed at /api/health, a transient Postgres
    # blip therefore kills this process — and this process holds every
    # pharmacy's live Baileys WhatsApp socket. A bad minute for the database
    # became a re-pair and a cold start for every pharmacy, and if the blip
    # persisted, a restart loop. Nothing would have alerted: customers simply
    # message a number that has stopped answering.
    #
    # /api/live answers "is this process running and serving" with no queries,
    # no awaits and no dependencies. The app can hold its sockets and keep
    # serving through a database outage, and recover on its own when Postgres
    # returns — which is the behaviour we actually want and the one this line
    # was preventing.
    #
    # GOLDEN-006 asserts the two stay in agreement.
    healthCheckPath: /api/live
    envVars:
      - key: NODE_ENV
        value: production

      # OFF, explicitly. This bypass serves every request as a fixed pharmacy
      # with no authentication — it exists for local development and would be
      # an open door in production. Stated here rather than omitted so it
      # cannot be switched on by an inherited default.
      - key: DEV_AUTH_BYPASS
        value: "false"

      # ---- set by hand in the dashboard (sync:false = never in git) ----
      - key: DATABASE_URL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      # Encrypts stored WhatsApp credentials. If this is lost or changed,
      # every pharmacy must re-pair their phone — back it up before deploying.
      - key: SESSION_ENCRYPTION_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false

      # ---- baked into the client bundle at BUILD time ----
      #
      # Vite inlines VITE_* at build, not at run, so these must exist during
      # buildCommand or the dashboard ships with sign-in disabled and no
      # error until someone tries to log in. The anon key is publishable and
      # designed to sit in a browser; the service-role key above must never
      # appear in a VITE_ variable.
      - key: VITE_SUPABASE_URL
        sync: false
      - key: VITE_SUPABASE_ANON_KEY
        sync: false

    # Baileys keeps its auth state in Postgres (encrypted), not on disk, so no
    # persistent volume is required — which is what allows a restart or a
    # redeploy to restore the WhatsApp session rather than demand a re-pair.
