<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>RxNaija</title>

    <!--
      The resting tab icon, inline so it costs no request and is painted
      before any JavaScript runs. Favicon.jsx replaces this link's href once
      the app mounts, and repaints it as a pulsing alert whenever something
      needs a person — see that file for why an animated GIF or SVG could not
      have done the job.

      This static one still has to be right on its own: it is what a visitor
      sees on the sign-in screen, on a slow connection, and if the bundle
      fails outright.
    -->
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%2310b981'/%3E%3Ctext x='16' y='17' fill='white' font-family='system-ui,sans-serif' font-size='21' font-weight='600' text-anchor='middle' dominant-baseline='central'%3ER%3C/text%3E%3C/svg%3E"
    />

    <!--
      Manrope carries the marketing site's display voice, and the sign-in
      screen is the seam between that site and the dashboard — arriving from
      home.html into a different typeface reads as landing on someone else's
      product mid-signup.

      Inter is the dashboard's own body face (design.md), loaded in the same
      request rather than a second round trip: both are on the critical path
      for SOME first screen (Manrope for sign-in, Inter for everything past
      it), and a visitor only ever needs one of the two on first paint.

      preconnect first: on the critical path for the very first screen an
      unauthenticated visitor sees, and without it the browser only starts
      the TLS handshake once it has parsed the stylesheet link.

      This supersedes the system-stack decision design.md used to make for
      the dashboard — see that file's Typography section for the tradeoff
      being accepted (a webfont on the paint path) and why.
    -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Manrope:wght@500;600;800&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
